[project]
name = "swisstms-fix-codec"
version = "0.1.0"
description = "Python wrappers around simplefix for fixtures and replay scripts."
requires-python = ">=3.12"
dependencies = [
    "simplefix>=1.0.17",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "hypothesis>=6.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swisstms_fix_codec"]
