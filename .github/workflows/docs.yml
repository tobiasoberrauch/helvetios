name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'specs/**'
      - 'mkdocs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'specs/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install mkdocs-material mkdocs-mermaid2-plugin
      - run: |
          if [ -f docs/mkdocs.yml ]; then
            mkdocs build -f docs/mkdocs.yml -d "${GITHUB_WORKSPACE}/_site_check" --strict || true
          fi

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install mkdocs-material mkdocs-mermaid2-plugin
      - run: |
          if [ -f docs/mkdocs.yml ]; then
            # mkdocs resolves -d relative to mkdocs.yml — use an absolute path so
            # the output never lands inside docs/ (would re-trigger the docs_dir conflict).
            mkdocs build -f docs/mkdocs.yml -d "${GITHUB_WORKSPACE}/_site"
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./_site }
      - id: deployment
        uses: actions/deploy-pages@v4
