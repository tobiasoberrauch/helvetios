name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem + container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  grype:
    name: Anchore Grype scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/scan-action@v4
        with:
          path: .
          severity-cutoff: high
          fail-build: true

  sbom:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json

  cosign-sign:
    name: cosign / Sigstore sign images
    runs-on: ubuntu-latest
    needs: [trivy, grype, sbom]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Sign published images
        run: |
          # Phase 16 (T331) — wire image push then sign each Bootbuildimage output.
          echo "TODO Phase 16: cosign sign --yes <registry>/swisstms/<image>:<sha>"

  secret-scan:
    name: Detect committed secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
