name: unit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java (JUnit 5 + jqwik)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: '**/build/test-results/test/*.xml'

  python:
    name: Python (pytest + Hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
      - run: |
          uv sync
          uv run --project libs/fix-codec-py --extra test pytest libs/fix-codec-py/tests/ -q
          uv run --project apps/surveillance-service --extra test pytest apps/surveillance-service/tests/ -q

  typescript:
    name: TypeScript (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          if [ -f apps/trader-ui/package.json ]; then
            cd apps/trader-ui
            # No lockfile committed yet (Phase 16 polish on the trader-ui track) —
            # `npm install` (not `npm ci`) so CI works without a pre-generated lock.
            npm install --no-audit --no-fund
            npm test --if-present
          else
            echo "trader-ui not yet present"
          fi

  go:
    name: Go (testify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: |
          if compgen -G "tools/*/go.mod" > /dev/null; then
            # go.work at repo root binds tools/ptp-audit-report; address it explicitly so the
            # `directory prefix tools does not contain modules` issue cannot recur.
            go test ./tools/ptp-audit-report/...
          else
            echo "No Go modules yet"
          fi
