name: performance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  jmh:
    name: JMH microbenchmarks (FIX, SBE, Aeron, pre-trade-risk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jmh --stacktrace || echo "no JMH tasks yet (Phase 2+)"
      - name: Compare against main baseline
        run: |
          # Phase 16 (T339) wires Mimir push + > 20% regression flag.
          echo "TODO: compare to baseline; mark PR as performance-regression on > 20% degradation"

  k6-syntax:
    name: k6 syntax check (full load runs need a deployed backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: |
          if compgen -G "tests/performance/k6/*.js" > /dev/null; then
            for f in tests/performance/k6/*.js; do
              echo "↳ checking $f"
              k6 inspect "$f"
            done
          else
            echo "no k6 scripts yet"
          fi
