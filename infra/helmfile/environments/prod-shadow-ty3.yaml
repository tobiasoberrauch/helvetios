# Production-shadow per region (ty3). WORM via S3 Object Lock,
# Aurora Global DB für Postgres, Kafka MirrorMaker 2 cross-region.
postgresql:
  primary:
    persistence:
      enabled: true
      size: 1Ti
      storageClass: managed-premium

global:
  region: ty3
  worm:
    enabled: true
    bucket: swisstms-regulatory-ty3
