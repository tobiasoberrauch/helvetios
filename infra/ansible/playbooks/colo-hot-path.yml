---
# Phase 14 — Hot-path bare-metal tuning for SIX OTI / Eurex T7 ETI / BidFX
# Pixie / MarketAxess hot-quotes. RHEL 9 with `tuned` low-latency profile.
- name: Configure trading-floor co-lo bare metal
  hosts: hot_path_servers
  become: true
  tasks:
    - name: Install tuned
      package: { name: tuned, state: present }

    - name: Apply low-latency profile
      command: tuned-adm profile latency-performance

    - name: Disable transparent hugepages (bad for Aeron)
      shell: echo never > /sys/kernel/mm/transparent_hugepage/enabled
      changed_when: false

    - name: Pin Aeron driver to dedicated CPU cores
      copy:
        dest: /etc/swisstms/aeron-cpu-pinning.conf
        content: |
          # CPU pinning for Aeron sender/receiver/driver/conductor.
          # Cores 0-1 reserved for OS + IRQ
          # Cores 2-5 dedicated to Aeron + EMS matching thread
          aeron.sender.idle.strategy=BUSY_SPIN
          aeron.receiver.idle.strategy=BUSY_SPIN
          aeron.conductor.idle.strategy=BUSY_SPIN

    - name: NIC tuning (Solarflare / Mellanox)
      shell: |
        ethtool -G eth0 rx 4096 tx 4096
        ethtool -K eth0 gso off gro off lro off
        ethtool -A eth0 rx off tx off
      changed_when: false
