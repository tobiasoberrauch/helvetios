[project]
name = "swisstms-surveillance-service"
version = "0.1.0"
description = "Market-abuse surveillance — layering / spoofing detection (US8)."
requires-python = ">=3.12"
dependencies = [
    "apache-flink>=1.18.0; python_version<'3.12'",  # placeholder — PyFlink wheel availability varies
    "kafka-python>=2.0.5",
    "opensearch-py>=2.7",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "hypothesis>=6.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surveillance"]
