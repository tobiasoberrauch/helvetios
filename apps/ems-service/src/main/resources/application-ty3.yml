# T270 — per-region EMS overlay for ty3.
#
# Aeron Cluster Raft can NOT span the WAN — every region runs an independent 5-node cluster.
# Cross-region order continuity comes from drop-copy (Constitution V) + Kafka MirrorMaker 2 not
# from cluster-level replication.
spring:
  config:
    activate:
      on-profile: ty3

swisstms:
  region: ty3
  ems:
    cluster:
      enabled: true
      members: 0,ems-service-0.ty3,9001,9002,9003,9004,9005;1,ems-service-1.ty3,9001,9002,9003,9004,9005;2,ems-service-2.ty3,9001,9002,9003,9004,9005;3,ems-service-3.ty3,9001,9002,9003,9004,9005;4,ems-service-4.ty3,9001,9002,9003,9004,9005
      archiveDir: /var/swisstms/aeron/archive/ty3
    journal:
      enabled: true
      path: /var/swisstms/journal/ems/ty3
