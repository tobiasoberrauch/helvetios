# T270 — per-region EMS overlay for ld4.
#
# Aeron Cluster Raft can NOT span the WAN — every region runs an independent 5-node cluster.
# Cross-region order continuity comes from drop-copy (Constitution V) + Kafka MirrorMaker 2 not
# from cluster-level replication.
spring:
  config:
    activate:
      on-profile: ld4

swisstms:
  region: ld4
  ems:
    cluster:
      enabled: true
      members: 0,ems-service-0.ld4,9001,9002,9003,9004,9005;1,ems-service-1.ld4,9001,9002,9003,9004,9005;2,ems-service-2.ld4,9001,9002,9003,9004,9005;3,ems-service-3.ld4,9001,9002,9003,9004,9005;4,ems-service-4.ld4,9001,9002,9003,9004,9005
      archiveDir: /var/swisstms/aeron/archive/ld4
    journal:
      enabled: true
      path: /var/swisstms/journal/ems/ld4
