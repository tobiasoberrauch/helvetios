{{/*
  T303 — audit-service. Two replicas; the daily HashChainVerifier runs as a CronJob (separate
  resource, see verifier-cronjob.yaml).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/tier: cold
spec:
  replicas: {{ .Values.replicaCount | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-service
    spec:
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrap | quote }}
            - name: SWISSTMS_AUDIT_OPENSEARCH_URL
              value: {{ .Values.opensearch.url | quote }}
            - name: SWISSTMS_AUDIT_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "300m" }}
              memory: {{ .Values.resources.requests.memory | default "1Gi" }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "1500m" }}
              memory: {{ .Values.resources.limits.memory | default "2Gi" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-verifier
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "0 4 * * *"  # 04:00 UTC — daily hash-chain verification (Constitution VI)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: verifier
              image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
              command: ["java", "-cp", "/app/app.jar", "ch.swisstms.audit.HashChainVerifier"]
