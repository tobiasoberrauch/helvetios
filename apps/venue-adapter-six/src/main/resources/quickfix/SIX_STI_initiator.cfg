; Phase 14 (Multi-Region prod-shadow) — production-shadow QuickFIX/J initiator
; against the SIX STI endpoint. Phase 3 (US1) uses the in-process simulated
; mock in SixStiAdapter.

[default]
ConnectionType=initiator
StartTime=06:00:00 UTC
EndTime=22:30:00 UTC
HeartBtInt=30
ReconnectInterval=5
FileLogPath=/var/log/quickfix/six-sti
JdbcDriver=org.postgresql.Driver
JdbcURL=jdbc:postgresql://oms-db:5432/swisstms
JdbcUser=swisstms
SocketUseSSL=Y
SSLProtocol=TLSv1.3
SSLKeyStore=/etc/swisstms/keystores/six-sti.p12
SSLKeyStorePassword=#{vault:secret/data/six-sti/keystore-password}
RefreshOnLogon=Y

[session]
BeginString=FIX.4.4
SenderCompID=SWISSTMS
TargetCompID=SIX-STI
SocketConnectHost=fix.six-group.com
SocketConnectPort=8543
DataDictionary=contracts/fix/venues/SIX_STI_FIX44.xml
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N
