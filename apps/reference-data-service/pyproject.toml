[project]
name = "swisstms-reference-data-service"
version = "0.1.0"
description = "Instrument master, legal entities, calendars (US6 / Phase 8)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refdata"]
