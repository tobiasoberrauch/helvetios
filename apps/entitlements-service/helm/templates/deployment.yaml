{{/*
  T170 — entitlements-service Deployment + Service.
  Three replicas — entitlements is the central authoritative source. FR-021 fail-closed: if the
  pod count drops below 1, the SubscriptionManager in market-data-service denies new subscribes.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: entitlements-service
    app.kubernetes.io/component: gating
spec:
  replicas: {{ .Values.replicaCount | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: entitlements-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: entitlements-service
    spec:
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "200m" }}
              memory: {{ .Values.resources.requests.memory | default "512Mi" }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "1000m" }}
              memory: {{ .Values.resources.limits.memory | default "1Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: entitlements-service
  ports:
    - port: 8080
      name: http
