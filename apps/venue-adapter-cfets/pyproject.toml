[project]
name = "swisstms-venue-adapter-cfets"
version = "0.1.0"
description = "CFETS via Bloomberg / Tradeweb / MarketAxess proxy (Phase 15)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "hypothesis>=6.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfets"]
